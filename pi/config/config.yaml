# INA700 project configuration.

profile: lab             # mock | lab
# The offline profile is kept at config/config.mock.yaml:
#   python main.py --config config/config.mock.yaml

# --- the three shapes--------------------------------------
# Valid values: CIRCLE, SQUARE, TRIANGLE, STAR, HEXAGON
# The remaining two must NOT appear here and must NOT be labelled in training.
shapes:
  - CIRCLE
  - SQUARE
  - STAR

camera:
  kind: basler           # synthetic | file | basler
  fps: 10.0              # kind: synthetic - blank frames, no hardware needed
  # kind: file
  directory: ../model/dataset/samples
  loop: true
  # kind: basler
  serial_number: null    # null = first camera found 
  # Raised from 3000 on 2026-09-16. At 3000 the sheet read 53/255 against a
  # target of 180-210 - roughly 3.7x too dark, and contrast scales with
  # signal, so every object sat that much closer to the paper. The photos the
  # model was trained on had the sheet at 144-153.
  # At 11000 us the camera still runs about 89 fps against a capture_fps of
  # 10, so the exposure costs nothing. Check with preflight and adjust: the
  # response is not perfectly linear at the ends.
  exposure_us: 11000
  gain: 0.0              # lowest noise; raise exposure before ever raising this
  #The camera can deliver 71.8 fps, but inference does about 2.4, so 
  #anything above a few fps is grabbed and dropped unread - 15 MB a frame of pure waste, and a  
  # pinned core that starves the GUI. 10 keeps the preview lively without competing.
  capture_fps: 15.0
  # Where to drop the newest frame for another process to read. The Basler
  # can only be opened once, so a calibration tool cannot take its own frames
  # while main.py is running - and angle_match.py has to, because it measures
  # the object before and after a cycle that only main.py can command.
  # null = off, which costs nothing. Roughly 70 ms of JPEG encoding each time
  # it fires, so leave it off for a production run.
  frame_tap: null
  frame_tap_interval_s: 0.5
  timeout_ms: 5000
  # Ask for the whole sensor on every open. The camera remembers its area of
  # interest in its own memory, so a crop left behind in Pylon Viewer survives
  # a power cycle and quietly narrows the field of view - and a cropped image
  # looks exactly like a longer lens, with nothing in it saying so. Set false
  # only to run deliberately cropped, which is faster and sees less.
  full_sensor: true
  show_window: false     # true shows the raw feed while aiming

detector:
  kind: yolo            # yolo (ultralytics) | ncnn (no torch) | mock             # mock | yolo
  model_path: ../model/best.pt      # or best_ncnn_model for the Pi
  # Must equal the imgsz the model was trained at (model/train_yolo.ipynb).
  # Objects are about 250 px in the 2448 px frame, so 640 keeps them at 65 px.
  image_size: 640
  # Measured on the 55-image validation set: star precision was 0.886 at 0.5,
  # so roughly one star report in nine was a hexagon or triangle. Reporting a
  # forbidden shape is worse than missing one - the operator can simply ask
  # again. Raise this if a forbidden shape ever reaches the robot.
  confidence: 0.6
  # Maps the model's class indices to shapes. Must match your data.yaml order.
  class_map:
    0: CIRCLE
    1: SQUARE
    2: STAR

orientation:
  # fitted   - segment several ways, keep whichever mask an ideal square or
  #            star lays over best, and read the angle off that mask. The
  #            overlap is also the confidence, which is the number the gates
  #            below work on.
  # harmonic - the original: one Otsu mask, angle from the outline's N-th
  #            harmonic, confidence from how N-lobed that outline is. Kept so
  #            the two can be compared at the station.
  kind: fitted
  # Tried in this order, stopping at the first mask that plainly fits:
  #   otsu     brightness - a dark object on white paper
  #   chroma   colour, ignoring brightness - survives shadow and glare
  #   gradient the border's step in brightness - the only one that finds a
  #            WHITE object on white paper
  #   edges    Canny's outline, filled - strict, but precise when it answers
  mask_candidates: [otsu, chroma, gradient, edges]
  # Overlap with an ideal shape, 0 to 1. Measured on the labelled photos:
  # right answers sit above 0.75, wrong ones below 0.6.
  min_fit: 0.60          # below this there is no angle to report at all
  good_enough_fit: 0.85  # stop trying other segmentations once this is met
  fit_step_deg: 2.0      # sweep step; a parabola refines the winner
  agreement_deg: 4.0     # how far the two angle readings may differ
  padding_px: 4          # keeps a star's thin points inside the crop
  binary_threshold: 0    # 0 = Otsu, adapts to lab lighting
  bins: 180              # directions sampled around the outline  (harmonic only)
  # kind: harmonic only. Below this the outline shows no N-fold structure and
  # any angle would be noise, so it reports no rotation instead of guessing.
  # kind: fitted judges a reading by min_fit above instead.
  min_confidence: 0.05
  # Grey levels of separation between the object and the paper, below which
  # there is no outline to trace. Measured across the labelled photos:
  #     contrast 37-120  ->  angle error 0.05-0.46 deg
  #     contrast 16, 25  ->  angle error 2.81, 9.11 deg
  # Both failures were WHITE objects on white paper - three or four grey
  # levels apart, less than the sensor's noise. Otsu then returns the paper
  # and the angle is confidently wrong. Canny and a LAB colour distance fail
  # the same way, so this is a gate rather than a knob: a low reading means
  # the lighting cannot show the object's edge, and the answer is a side
  # light or a non-white sheet, not a smaller number here.
  # kind: harmonic only. kind: fitted needs no contrast gate: the gradient and
  # edge candidates are there precisely to measure the objects that fail it.
  min_contrast_levels: 20.0
  # Nothing is refused on a poor fit. Every detected object is placed at the
  # best angle that could be worked out for it: when no segmentation fits
  # well, the candidates' fit-weighted consensus is sent rather than a zero.
  # Being a few degrees out is a worse placement; being unrotated is a wrong
  # one. The fit travels with each reading and the log names the guesses, so
  # a run can still be judged afterwards.
  #
  # Measured over 184 labelled objects at five known rotations each:
  # readings above 0.80 held to 0.17 deg on stars and 2 deg on squares; below
  # 0.60 they are guesses, and are logged as such.

colour:
  kind: hsv              # hsv | passthrough (passthrough = offline mock only)
  min_saturation: 80
  # 50 threw the object away with the noise: dark green circles and blue
  # stars in shadow had nearly every pixel below it and came out UNKNOWN.
  # 35 recovers all ten of those without reaching into the black objects.
  min_value: 35
  # Share of the OBJECT's own pixels one hue must cover to name it. Measured:
  # real colours cover 20-100%, hue noise on a black object under 1.4%.
  min_fraction: 0.10
  # A real colour agrees with itself. Genuinely coloured objects score 0.96
  # and up here; a dark object's few saturated pixels scatter and never got
  # above 0.82. Below this the object falls through to the brightness test,
  # which is the safe failure - UNKNOWN just fails to match a colour request,
  # where a confident wrong colour sends the robot to the wrong object.
  min_hue_agreement: 0.85
  # White and black have no hue, so they are judged on brightness against the
  # paper instead. Fractions of the paper's own level, so they hold as the
  # lighting moves.
  achromatic_max_saturation: 70
  white_of_paper: 0.80
  black_of_paper: 0.45

# --- the picking sheet ------------------------------------------------------
# The A3 sheet, in picking work object millimetres. wobj1's origin sits ON the
# sheet corner with X along the 420 mm edge, so this is 0,0 and 420x297 by
# construction - the same values as SHEET_ORIGIN/SHEET_SPAN in StationData.mod.
#
# This is what keeps objects already sitting in the JIG from being offered as
# picking candidates. The jig is in the camera frame on purpose, so the vision
# system sees those objects and must be told they are not pickable. RAPID
# refuses an off-board position too, but a refusal wastes the whole cycle.
sheet:
  origin_xy_mm: [0.0, 0.0]
  # +X runs along the SHORT (297 mm) edge, +Y along the long one, because
  # that is how wobj1 was taught: X1 at the sheet corner, X2 jogged along
  # the short edge.
  span_xy_mm: [297.0, 420.0]
  # Generous: it only has to stay well clear of the jig, and an object half
  # off the paper is still on the table and still worth picking.
  margin_mm: 20.0

# --- ArUco reference marker (README requirement) ----------------------------
# A 5x5 marker is PRINTED at the exact centre of the A3 sheet. Its four corners
# give the pixel-to-millimetre mapping every frame, so a nudged camera corrects
# itself.
#
# Printing it is what removes the measurement. wobj1's origin is the sheet
# corner and its axes run along the sheet edges, so the marker centre is half
# the sheet in each direction BY CONSTRUCTION - 148.5, 210.0 - and no robot
# jogging, ruler or tape is involved. Regenerate the sheet with
#   python tools/make_marker_sheet.py -o ../docs/marker_sheet_a3.pdf
# and print it at 100% scale; the bar along the bottom must measure 100.0 mm.
#
# The marker lies FLAT on the sheet, one object-thickness below the object top
# faces the camera actually sees. That parallax is corrected in the
# object_height block below - see the note there.
aruco:
  dictionary: DICT_5X5_100
  marker_id: 0                 # null = accept any marker in view
  marker_length_mm: 100.0      # the printed OUTER BLACK SQUARE, not the paper
  # Half of 297 and half of 420: the centre of the sheet, which is where the
  # marker is printed. Nothing here was measured, so nothing here can drift.
  marker_centre_xy_mm: [148.5, 210.0]
  #
  # The printed marker's edges are parallel to the sheet edges, so these two
  # are exact - but WHICH exact value depends on which physical corner was
  # taught as wobj1's origin. There are only eight possibilities (four
  # quarter-turns, mirrored or not), so measure rather than reason:
  #   1. Lay one object near a sheet corner you can identify.
  #   2. Read the reported X,Y off the GUI and compare with a ruler from the
  #      sheet edges.
  #   3. Both wrong in a way that swaps X and Y -> angle 90 or 270.
  #      Only Y wrong, mirrored about the sheet centre -> y_axis_flipped true.
  # Repeat with the object at a second corner before believing the answer.
  # Measured 2026-09-11 with the circle at 50, 35 from the origin corner:
  # the reading came back rotated a quarter turn about the marker centre,
  # so the camera sees the sheet turned 90 deg from the printed page.
  marker_angle_deg: 90.0       # 0 / 90 / 180 / 270 - confirm with the test above
  y_axis_flipped: false        # flip if a test pick comes out mirrored in Y
  redetect_every_n_frames: 1   # 1 = re-solve every frame; raise if time is tight
  hold_last_good: true         # keep working if a hand briefly covers the marker
  scale_tolerance: 0.15        # reject a solve that disagrees with the perimeter check

# All vision coordinates are expressed in the PICKING work object (wobjPick).
# The placing work object belongs entirely to the robot program - the Pi never
# computes a placing position, which is why reprogramming the placing jig needs
# no change here at all.
coordinates:
  mapper: aruco          # identity | aruco
  angle_sign: -1         # image Y points down; verify once with a 45 deg test object
                         # (with the aruco mapper the homography already handles
                         #  position; this sign only affects the rotation)
  angle_offset_deg: 0.0
  # The angle each shape must ARRIVE at. Do not work these out from first
  # principles - measure them. rz = slot_angle - object_angle, and both terms
  # come from the same camera, so every constant offset cancels itself.
  #
  # Position the jig IN THE CAMERA FRAME, then:
  #
  #   python calibration/slot_angles.py --camera basler
  #
  # Seat the object in its slot, box that slot, press SPACE. Then lift it out,
  # seat it again, and press SPACE again - at least three times per shape.
  # A shape-matched slot still has play in it, and the spread across seatings
  # is the only honest measure of how much. One reading cannot tell you whether
  # the slot repeats to a tenth of a degree or to five, and the tool's own
  # frame-to-frame spread only measures camera noise.
  #
  # The saved block carries that play beside each angle. It is the tolerance
  # every placement of that shape has to live inside: a slot marked LOOSE
  # forgives a sloppy arrival angle, a tight one does not.
  #
  # If the jig CANNOT be brought into frame, lift each object straight out of
  # its slot without turning it, set it on the picking sheet and measure there.
  # It works, but your hand is now between the slot and the number: any twist
  # during the lift becomes a permanent error in a value every placement
  # depends on, and the reading will look perfectly steady while being wrong.
  #
  # Re-measure whenever the jig moves - the angle depends on the jig's
  # rotation, so nudging it round quietly invalidates all of these.
  # The circle is always 0; it has no orientation to get wrong.
  # Measured 2026-09-09 with calibration/slot_angles.py, five seatings each.
  # 'play' is the spread across those seatings - the slot's slack plus
  # measurement noise - and the placement must tolerate all of it.
  # SQUARE and STAR agree on 45.5 deg to within half a degree despite having
  # different symmetry periods, which is the jig plate's own rotation showing
  # through both: independent confirmation that neither is an artefact.
  place_slot_angles_deg:
    CIRCLE: 0.00   # 1 seating(s), play 0.00 deg
    STAR: 56.05   # 6 seating(s), LOOSE: 10.83 deg of a 72 deg period
    SQUARE: 53.48   # 5 seating(s), play 0.30 deg

robot:
  # This file IS the lab profile, so it expects a real robot. The mock and
  # offline profiles override this to loopback.
  transport: tcp         # loopback | tcp
  # The address THIS machine listens on - the robot dials in to us, so this
  # is never the robot's address.
  #
  # 0.0.0.0 means every interface. That is deliberate rather than lazy: the
  # server runs on the PC during development and on the Raspberry Pi at the
  # exam, and those have different addresses, so a fixed one here is a file
  # that must be edited on the day. Binding a specific address that no adapter
  # holds fails with WinError 10049 / EADDRNOTAVAIL, which is what a pulled
  # cable or a changed DHCP lease looks like.
  #
  # Pin it to one address only if the machine is on more than one network and
  # the robot must be kept off the others. Check the real one with 'ipconfig'
  # (Windows) or 'ip addr' (Linux). The PC has been seen at 192.168.125.201.
  host: 0.0.0.0
  port: 5000
  accept_timeout_s: 120.0
  # The robot answers only after the operator has pressed the yellow button
  # AND the motion has finished, so this waits on a person, not a machine.
  reply_timeout_s: 300.0
  max_attempts: 3        # first try plus the two retries the course allows
  # Pause before a retry, so it looks at a NEW frame. Straight away it read
  # the same scene as the failed attempt and failed the same way.
  retry_delay_s: 1.5
  # A cycle requested while the robot is not connected waits this long for it
  # instead of spending all three attempts in the same second. Past this the
  # cycle is reported as not attempted, with the attempts still unused.
  connect_wait_s: 30.0
  # After the robot reports success the board is checked again: an object of
  # the same shape still within this distance means the cup never lifted it.
  # This is what makes the retry real, since the robot has no grip sensor.
  # 0 disables it - required for the mock profile, whose scene never changes.
  # Set 10-15 mm in the lab.
  verify_tolerance_mm: 0.0

vision:
  inference_budget_ms: 3000.0
  min_confidence: 0.5

gui:
  # tk      - a window: live preview, table, warnings. Needs a display.
  # console - type "circle red" at the terminal. Needs no display at all,
  #           which is what makes an SSH session on the Pi work; Tk fails
  #           there with "no display name and no $DISPLAY".
  kind: tk
  refresh_ms: 100
  # Type commands in the terminal that launched the window. Ignored when
  # kind is console, which already owns its terminal. Tk has to hold the main
  # thread, so this reads stdin on a thread of its own.
  terminal_input: false
  # A named pipe any other terminal can write to, so the system keeps
  # one terminal for its own output and commands come from another:
  #     echo "circle red" > /tmp/ina700.cmd
  # null disables it. Works alongside either view.
  command_pipe: null

logging:
  level: INFO
  file: logs/ina700.log
