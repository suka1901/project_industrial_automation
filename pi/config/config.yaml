# INA700 project configuration.

profile: lab             # mock | lab
# The offline profile is kept at config/config.mock.yaml:
#   python main.py --config config/config.mock.yaml

# --- the three shapes--------------------------------------
# Valid values: CIRCLE, SQUARE, TRIANGLE, STAR, HEXAGON
# The remaining two must NOT appear here and must NOT be labelled in training.
shapes:
  - CIRCLE
  - SQUARE
  - STAR

camera:
  kind: basler           # synthetic | file | basler
  fps: 10.0              # kind: synthetic - blank frames, no hardware needed
  # kind: file
  directory: ../model/dataset/samples
  loop: true
  # kind: basler
  serial_number: null    # null = first camera found (acA2440-75uc, 24202295)
  # These are PUSHED TO THE CAMERA on every run and override whatever Pylon
  # Viewer is showing. Run tools/preflight.py: it reports the camera's own
  # exposure and gain, and those are the numbers to copy in here.
  # Set both to null to leave the camera's settings alone.
  exposure_us: 3000      # measured from the camera 2026-09-04
  gain: 0.0              # lowest noise; there is plenty of light
  timeout_ms: 5000
  show_window: false     # true shows the raw feed while aiming

detector:
  kind: yolo             # mock | yolo
  model_path: ../model/best.pt      # or best_ncnn_model for the Pi
  # Must equal the imgsz the model was trained at (model/train_yolo.ipynb).
  # Objects are about 250 px in the 2448 px frame, so 640 keeps them at 65 px.
  image_size: 640
  # Measured on the 55-image validation set: star precision was 0.886 at 0.5,
  # so roughly one star report in nine was a hexagon or triangle. Reporting a
  # forbidden shape is worse than missing one - the operator can simply ask
  # again. Raise this if a forbidden shape ever reaches the robot.
  confidence: 0.6
  # Maps the model's class indices to shapes. Must match your data.yaml order.
  class_map:
    0: CIRCLE
    1: SQUARE
    2: STAR

orientation:
  padding_px: 8          # keeps a star's thin points inside the crop
  binary_threshold: 0    # 0 = Otsu, adapts to lab lighting
  bins: 180              # directions sampled around the outline
  # Below this the shape shows no N-fold structure and any angle would be
  # noise, so the estimator reports no rotation instead of guessing.
  min_confidence: 0.05
  # And below this the object is not picked at all. Measured on the real
  # photos: above 0.10 the angle held to 1.5 deg, below 0.05 it was 12 deg out.
  # A circle is exempt - it has no orientation to get wrong.
  min_place_confidence: 0.10

colour:
  kind: hsv              # hsv | passthrough (passthrough = offline mock only)
  min_saturation: 80
  min_value: 50
  min_fraction: 0.25
  # White and black have no hue, so they are judged on brightness against the
  # paper instead. Fractions of the paper's own level, so they hold as the
  # lighting moves.
  achromatic_max_saturation: 70
  white_of_paper: 0.80
  black_of_paper: 0.45

# --- ArUco reference marker (README requirement) ----------------------------
# A 5x5 marker is fixed on the table. Its four corners give the pixel-to-
# millimetre mapping every frame, so a nudged camera corrects itself.
#
# The supplied rubber marker is 100 mm, so only its POSITION needs measuring:
#   1. Jog the robot tool tip to the marker's centre, read wobj1 X and Y.
#   2. Note how the marker is turned relative to the wobj1 X axis.
# The marker need not sit at the work object origin - any offset works.
# Mount it level with the TOP of the objects: the homography maps to the plane
# the marker lies in, and the camera sees the objects' top faces.
aruco:
  dictionary: DICT_5X5_100
  marker_id: 0                 # null = accept any marker in view
  marker_length_mm: 100.0      # the supplied rubber marker
  marker_centre_xy_mm: [0.0, 0.0]   # marker centre in wobj1 - MEASURE THIS
  marker_angle_deg: 0.0
  y_axis_flipped: false        # flip if a test pick comes out mirrored in Y
  redetect_every_n_frames: 1   # 1 = re-solve every frame; raise if time is tight
  hold_last_good: true         # keep working if a hand briefly covers the marker
  scale_tolerance: 0.15        # reject a solve that disagrees with the perimeter check

# All vision coordinates are expressed in the PICKING work object (wobjPick).
# The placing work object belongs entirely to the robot program - the Pi never
# computes a placing position, which is why reprogramming the placing jig needs
# no change here at all.
coordinates:
  mapper: aruco          # identity | aruco | homography
  homography_file: calibration/homography.json
  # Pick depth relative to the taught pick origin in wobjPick. 0 means "the
  # height the robtarget was taught at"; use this only to trim for thickness.
  pick_depth_mm: 0.0
  angle_sign: -1         # image Y points down; verify once with a 45 deg test object
                         # (with the aruco mapper the homography already handles
                         #  position; this sign only affects the rotation)
  angle_offset_deg: 0.0
  # The angle each shape must ARRIVE at. Do not try to work these out from
  # first principles - measure them, and every constant offset cancels:
  #
  #   1. Seat the object in its slot in the jig.
  #   2. Lift it straight out WITHOUT TURNING IT, set it on the picking board.
  #   3. Read it with:  python calibration/slot_angles.py --camera basler
  #
  # An object later found lying at that angle then needs no rotation at all.
  # Re-measure whenever the jig moves. The circle is always 0.
  place_slot_angles_deg:
    CIRCLE: 0.0
    SQUARE: 0.0
    STAR: 0.0

robot:
  transport: loopback    # loopback | tcp
  # Address of THIS machine - the one running the server. The robot dials out
  # to it. Verified working on the PC at .201; on the Raspberry Pi it will be
  # the Pi's own address, so check with ipconfig / ip addr before the exam.
  # "0.0.0.0" binds every interface and accepts the robot whatever address it
  # uses - the safest setting if the network is ever in doubt.
  host: 192.168.125.201
  port: 5000
  accept_timeout_s: 120.0
  # The robot answers only after the operator has pressed the yellow button
  # AND the motion has finished, so this waits on a person, not a machine.
  reply_timeout_s: 300.0
  max_attempts: 3        # first try plus the two retries the course allows
  # After the robot reports success the board is checked again: an object of
  # the same shape still within this distance means the cup never lifted it.
  # This is what makes the retry real, since the robot has no grip sensor.
  # 0 disables it - required for the mock profile, whose scene never changes.
  # Set 10-15 mm in the lab.
  verify_tolerance_mm: 0.0

vision:
  inference_budget_ms: 3000.0
  min_confidence: 0.5

gui:
  refresh_ms: 100

logging:
  level: INFO
  file: logs/ina700.log
