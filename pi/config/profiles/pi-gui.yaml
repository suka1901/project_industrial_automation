# The Raspberry Pi, driven from its own screen instead of over SSH.
#
#   python3 main.py --config config/profiles/pi-gui.yaml
#
# Run this from a session that HAS a display - the monitor plugged into the
# Pi, or VNC. Over plain SSH Tk fails with "no display name and no $DISPLAY",
# which is why config/profiles/pi.yaml stays on the console view.
#
# Needs python3-tk:  sudo apt install python3-tk
#
# Everything else - the NCNN detector, the thread count, the confidence -
# comes from pi.yaml, so the two ways of running the station cannot drift
# apart in anything that affects what it detects.

extends: pi.yaml

profile: pi-gui

# This is the profile used at the bench, where the calibration tools run
# alongside the system, so the frame tap is on here and off everywhere else.
camera:
  frame_tap: /tmp/ina700_frame.jpg
  frame_tap_interval_s: 0.5

gui:
  kind: tk
  # Smaller than on the PC: here the window shares four cores with ncnn, and
  # the rescale is what it spends them on. 640 costs about 40 percent of what
  # 1000 does, for a picture nobody is measuring from.
  preview_max_width: 640
  # Both, deliberately: the window shows the live view on the Pi's
  # monitor while the terminal that launched it still takes typed
  # commands, and any other terminal can use the pipe.
  terminal_input: true
  # The preview competes with NCNN for the same four cores here, unlike on the
  # PC where it is free. If inference times drift after switching to the
  # window, this and camera.capture_fps are the two knobs.
  refresh_ms: 100
